name: Atualizar lista verificada de canais

on:
  schedule:
    - cron: '0 6 * * *'   # todo dia, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-lists.mjs
      - name: Commit se mudou
        run: |
          if [ -n "$(git status --porcelain lists/brasil-verificados.m3u)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add lists/brasil-verificados.m3u
            git commit -m "Atualiza lista verificada de canais"
            git push
          fi
